name: Verify public distribution
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-distribution.mjs
