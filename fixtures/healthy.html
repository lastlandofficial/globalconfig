<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account settings</title><link rel="stylesheet" href="/styles/glocon.css"></head>
<body style="font-family:system-ui;background:#fff;color:#18181b;margin:24px"><main><h1>Account settings</h1><form class="glocon-stack" style="max-width:480px">
<div class="glocon-field"><label class="glocon-label" for="email">Email address</label><p class="glocon-hint" id="email-hint">Use your work email address.</p><input class="glocon-input" id="email" type="email" autocomplete="email" aria-describedby="email-hint"></div>
<button class="glocon-button" type="submit">Save changes</button><div role="status" id="status"></div></form></main></body></html>
